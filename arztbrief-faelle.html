casesData.sort((a,b)=>{
  const code=value=>{const match=value.match(/^(\d+)([A-Z])\./);return match?[Number(match[1]),match[2]]:[Number.MAX_SAFE_INTEGER,value]};
  const first=code(a.title),second=code(b.title);
  return first[0]-second[0]||first[1].localeCompare(second[1],'de');
});

function renderCases(){
  const root=document.getElementById('cases');
  casesData.forEach((data,index)=>{
    const section=document.createElement('section');section.className='case';section.dataset.patientGender=data.gender;section.dataset.v='c'+index;
    const title=document.createElement('h2');title.textContent=data.title;section.appendChild(title);
    const card=document.createElement('div');card.className='case-card';
    sectionDefinitions.forEach(def=>{
      const block=document.createElement('section');block.className='brief-section';block.dataset.section=def.key;
      const heading=document.createElement('h3');heading.textContent=def.label;
      const list=document.createElement('ul');
      (data.sections[def.key]||['<strong>Zu diesem Abschnitt lägen keine Angaben vor.</strong>']).forEach(sentence=>{const li=document.createElement('li');li.className='learn-item';li.innerHTML=sentence;list.appendChild(li)});
      block.append(heading,list);card.appendChild(block);
    });
    section.appendChild(card);root.appendChild(section);
  });
}
renderCases();

const caseSelect=document.getElementById('caseSelect'),cases=Array.from(document.querySelectorAll('.cases>.case'));

function genderMarkedParts(text,gender,patientIdentity){
  const parts=text.split(/(\s+)/),words=[];parts.forEach((part,partIndex)=>{if(/^\s+$/.test(part))return;const token=part.replace(/^[^A-Za-zÄÖÜäöüß-]+/,'').replace(/[^A-Za-zÄÖÜäöüß-]+$/,'');if(token)words.push({partIndex,lower:token.toLocaleLowerCase('de-DE')})});
  const marked=new Set(),female=new Set(['sie','ihr','ihre','ihren','ihrem','ihrer','ihres','patientin','patientinnen','nichtraucherin','architektin','lehrerin','friseurin','dozentin','projektmanagerin','kassiererin']),male=new Set(['er','ihn','ihm','seine','seinen','seinem','seiner','seines','patient','patienten','nichtraucher','bankkaufmann','busfahrer','pförtner','rechtsanwalt','sozialarbeiter','finanzbuchhalter','theologieprofessor']),single=gender==='female'?female:male;
  words.forEach(word=>{if(single.has(word.lower))marked.add(word.partIndex)});
  const patientNouns=gender==='female'?new Set(['patientin','patientinnen']):new Set(['patient','patienten']),context=gender==='female'?new Set(['die','der','eine','einer']):new Set(['der','dem','den','ein','einen','einem']);
  words.forEach((word,index)=>{if(!patientNouns.has(word.lower))return;marked.add(word.partIndex);for(let offset=1;offset<=3&&index-offset>=0;offset++){const previous=words[index-offset];if(/jährig(?:e|en|er|em|es)?$/.test(previous.lower))continue;if(context.has(previous.lower))marked.add(previous.partIndex);else break}});
  if(patientIdentity){const titles=gender==='female'?new Set(['frau']):new Set(['herr','herrn']);words.forEach((word,index)=>{if(titles.has(word.lower))marked.add(word.partIndex);const next=words[index+1];if(next&&next.lower==='sich'&&((gender==='female'&&word.lower==='die')||(gender==='male'&&word.lower==='der')))marked.add(word.partIndex)})}
  return{parts,marked};
}
function appendRenderedWord(target,text,className='',normalWeight=false){
  const word=document.createElement('span');word.className='word';if(className)word.classList.add(className);if(normalWeight)word.classList.add('age-number');let first=true;
  for(const char of text){const alpha=/[A-Za-zÄÖÜäöüß0-9]/.test(char),piece=document.createElement('span');if(!alpha){piece.className='punctuation';piece.textContent=char;first=true}else if(first){piece.className='first-letter';piece.textContent=char;first=false}else{piece.className='hidden-part';piece.textContent=char}word.appendChild(piece)}target.appendChild(word);
}
function renderLearnItem(li){
  if(li.querySelector(':scope>.rendered'))return;const container=li.closest('.case,.comparison-case-entry'),gender=container?.dataset.patientGender||'',identity=li.closest('.brief-section')?.dataset.section==='vorstellung';
  const segments=Array.from(li.childNodes).map(node=>({text:node.textContent,bold:node.nodeType===Node.ELEMENT_NODE&&node.tagName==='STRONG'}));li.textContent='';const rendered=document.createElement('span');rendered.className='rendered';
  segments.forEach(segment=>{const target=segment.bold?document.createElement('strong'):rendered;if(segment.bold){target.className='template-strong';rendered.appendChild(target)}const result=genderMarkedParts(segment.text,gender,identity);result.parts.forEach((part,index)=>{if(/^\s+$/.test(part)){target.appendChild(document.createTextNode(part));return}const age=part.match(/^(.+?)(-?jährig(?:e|en|er|em|es)?)([^A-Za-zÄÖÜäöüß-]*)$/i);if(identity&&age&&gender){appendRenderedWord(target,age[1],'',true);appendRenderedWord(target,age[2]+age[3],'patient-'+gender);return}appendRenderedWord(target,part,result.marked.has(index)?'patient-'+gender:'')})});li.appendChild(rendered);
}
document.querySelectorAll('.learn-item').forEach(renderLearnItem);
const modes={full:'',initial:'initial-mode',blank:'blank-mode'};document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.body.classList.remove('initial-mode','blank-mode');if(modes[button.dataset.mode])document.body.classList.add(modes[button.dataset.mode]);document.querySelectorAll('[data-mode]').forEach(item=>item.classList.toggle('active',item===button))}));
const modeSwitch=document.querySelector('.mode-switch');modeSwitch.classList.add('floating-control');document.body.appendChild(modeSwitch);const caseControl=document.querySelector('.case-select-control');caseControl.classList.add('floating-control');document.body.appendChild(caseControl);const tools=document.querySelector('.tools');if(tools&&!tools.children.length)tools.remove();
const themeButton=document.getElementById('themeToggle');function syncTheme(){themeButton.title=document.documentElement.getAttribute('data-theme')==='dark'?'Normal theme':'Dark theme'}themeButton.addEventListener('click',()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark';if(dark)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','dark');try{localStorage.setItem('fsp-theme',dark?'light':'dark')}catch(e){}syncTheme()});syncTheme();
