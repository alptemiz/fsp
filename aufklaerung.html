<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Aufklärung | FSP Trainer</title><style>
:root{--text-color:#1f2937;--background-color:#f7f8fa;--surface:#ffffff;--muted-color:#6b7280;--border-color:#d9dee7;--header-bg:#eef1f5;--button-color:#315fbd}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--background-color);color:var(--text-color);font-size:17px;line-height:1.55}
.site-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:7px 12px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border-color);backdrop-filter:blur(8px)}
.site-nav{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}.site-nav a{color:#374151;text-decoration:none;padding:5px 9px;border:1px solid transparent;border-radius:7px;font-size:14px;font-weight:600;line-height:1.2}.site-nav a:hover{background:#eef1f5}.site-nav a.active{background:#e8edf7;border-color:#cbd5e1;color:#1e3a6d}

.theme-toggle{position:fixed;right:12px;top:10px;z-index:10000;width:34px;height:34px;padding:0;border:1px solid var(--border-color);border-radius:9px;background:var(--surface);color:inherit;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:19px}.theme-toggle .sun,.theme-toggle .moon{display:none}html[data-theme="dark"] .theme-toggle .sun{display:inline}html:not([data-theme="dark"]) .theme-toggle .moon{display:inline}
html[data-theme="dark"]{color-scheme:dark;--text-color:#e5e7eb;--background-color:#0f1115;--surface:#171a21;--muted-color:#9ca3af;--border-color:#303642;--header-bg:#20242d;--button-color:#4f76c7}html[data-theme="dark"] .site-header{background:rgba(18,21,27,.96)}html[data-theme="dark"] .site-nav a{color:#cbd5e1}html[data-theme="dark"] .site-nav a:hover{background:#242a34}html[data-theme="dark"] .site-nav a.active{background:#29344a;border-color:#46546d;color:#dbeafe}
